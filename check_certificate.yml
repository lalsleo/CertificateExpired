---
- name: Check if there are expired certificates or ones that expire in the next 14 days
  hosts: all
  
  tasks:
  - name: Check certificate expiration
    win_shell: |
      dir Cert:\LocalMachine\my |
        Where-Object { $_.NotAfter -lt (Get-Date).AddDays(14) }
    register: expired_certs

  - debug:
      var: expired_certs.stdout_lines
